<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Org Chart Inference</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#e2e1db;--acc:#2f5fd0;--bad:#c0392b;--good:#1e8a5a;--gh:#8a6d1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ecebe6;--mut:#9a9992;--card:#222220;--line:#34342f;--acc:#7aa2ff;--bad:#ff7a6b;--good:#5fd39a;--gh:#e0b84f;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
body{max-width:980px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:19px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
select,input[type=text],button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.sl{flex:1;min-width:200px;display:flex;gap:8px;align-items:center}.sl input{flex:1}
.stat{font-size:13px;color:var(--mut)}.stat b{color:var(--fg)}
.q{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#ans{display:none;background:var(--card);border-left:3px solid var(--acc);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:14px}
details{margin-left:16px;border-left:1px solid var(--line)}details>summary{list-style:none;cursor:pointer;margin-left:-1px;padding:3px 0 3px 8px}
details>summary::-webkit-details-marker{display:none}
.leaf{margin-left:16px;border-left:1px solid var(--line);padding:3px 0 3px 8px}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.nm{font-weight:600;cursor:pointer}.ti{color:var(--mut);font-size:13px}
.b{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line)}
.ghost>summary .nm,.ghost .nm{color:var(--gh);font-style:italic}.ghost{border-left-style:dashed}
.wrong{color:var(--bad)}.right{color:var(--good)}
.tw{margin:12px 0 4px;font-weight:600;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
#dr{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px #0003;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#dr .x{position:absolute;right:12px;top:8px}.sig{display:grid;grid-template-columns:110px 1fr 46px;gap:6px;align-items:center;font-size:13px;margin:2px 0}
.bar2{height:8px;border-radius:4px;background:var(--acc)}.neg{background:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
</style></head><body>
<h1>Org Chart Inference</h1>
<div class="sub">Edges are drawn only where calibrated confidence clears the slider. Dashed gold nodes are leaders the data implies but doesn’t contain.</div>
<div class="bar">
 <select id="co"></select>
 <div class="sl"><span class="stat">Confidence ≥</span><input id="th" type="range" min="0" max="0.99" step="0.01"><b id="tv"></b></div>
 <label class="stat"><input id="tr" type="checkbox"> Reveal truth</label>
</div>
<div class="stat" id="st" style="margin-bottom:8px"></div>
<div class="q">
 <button id="q1">Who runs the data team?</button>
 <button id="q2">Who does the Head of Security report to?</button>
 <span><input id="ch" type="text" list="pl" placeholder="Pick a champion…"><datalist id="pl"></datalist> <button id="q3">Who’s the economic buyer above?</button></span>
</div>
<div id="ans"></div>
<div id="tree"></div>
<div id="dr"></div>
<script>
const D=__DATA__;const $=s=>document.querySelector(s);
let C,N,R,kids,thr=D.thr,truth=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(id){C=D.c[id];N={};C.n.forEach(a=>N[a[0]]={id:a[0],name:a[1],title:a[2],fn:a[3],lvl:a[4],to:a[5],p:a[6],ru:a[7],rp:a[8],tr:a[9],cm:a[10],rc:a[11]});
 R={id:C.root.id,name:C.root.name,title:C.root.title,lvl:0};N[R.id]=R;
 $("#pl").innerHTML=Object.values(N).sort((a,b)=>a.name<b.name?-1:1).map(x=>`<option value="${esc(x.name)}">`).join("");$("#ans").style.display="none";$("#dr").style.display="none";draw()}
const emitted=x=>x.to&&x.to!=="ROOT"&&x.p>=thr;
const key=x=>x.to==="GHOST"?"G:"+x.fn:x.to;
const ok=x=>x.to===x.tr||(x.to==="GHOST"&&x.tr==="MISSING");
function draw(){kids={};const un=[];let em=0,good=0;
 Object.values(N).forEach(x=>{if(x===R)return;if(emitted(x)){(kids[key(x)]??=[]).push(x);em++;if(ok(x))good++}else un.push(x)});
 const tot=Object.keys(N).length-1;
 $("#st").innerHTML=`<b>${em}</b> of ${tot} edges drawn (${(100*em/tot).toFixed(0)}%) · <b>${un.length}</b> abstained`+(truth?` · precision on drawn edges <b>${em?(100*good/em).toFixed(1):"–"}%</b>`:"");
 const sorted=a=>a.sort((p,q)=>(p.lvl-q.lvl)||(p.name<q.name?-1:1));
 function node(x,d){const ks=sorted(kids[x.id]||[]);const g=ks.length;let mark="";
  if(x!==R&&emitted(x)){const o=.4+.6*x.p;const bad=truth&&!ok(x);
   mark=`<span class="b ${truth?(bad?"wrong":"right"):""}" style="opacity:${o}">${(x.p*100).toFixed(0)}%${truth?(bad?" ✗":" ✓"):""}</span>`;
   if(bad)mark+=`<span class="ti wrong">true: ${x.tr==="MISSING"?"leader not in dataset":esc((N[x.tr]||{}).name)}</span>`}
  const row=`<div class="row" style="opacity:${x===R||!emitted(x)?1:.5+.5*x.p}"><span class="nm" data-id="${esc(x.id)}">${esc(x.name)}</span><span class="ti">${esc(x.title)}</span>${mark}${g?`<span class="ti">· ${g}</span>`:""}</div>`;
  return g?`<details ${d<2?"open":""}><summary>${row}</summary>${ks.map(k=>node(k,d+1)).join("")}</details>`:`<div class="leaf">${row}</div>`}
 let h=node(R,0);
 const gk=Object.keys(kids).filter(k=>k.startsWith("G:"));
 if(gk.length)h+=`<div class="tw">Implied leaders not in the dataset</div>`+gk.map(k=>{const fn=k.slice(2),ks=sorted(kids[k]);
  return `<details class="ghost" open><summary><div class="row"><span class="nm">${esc(fn)} leadership (not in dataset)</span><span class="ti">likely hidden buyer · ${ks.length} report${ks.length>1?"s":""}</span></div></summary>${ks.map(x=>node(x,2)).join("")}</details>`}).join("");
 const top=sorted(un.filter(x=>!x.to||x.p<thr)).slice(0,60);
 h+=`<div class="tw">Abstained (confidence below ${(thr*100).toFixed(0)}%) — ${un.length}</div>`+top.map(x=>`<div class="leaf"><div class="row" style="opacity:.75"><span class="nm" data-id="${esc(x.id)}">${esc(x.name)}</span><span class="ti">${esc(x.title)}</span><span class="b">${(x.p*100).toFixed(0)}% best guess</span>${truth?`<span class="ti">true: ${x.tr==="MISSING"?"not in dataset":esc((N[x.tr]||{}).name)}</span>`:""}</div></div>`).join("")+(un.length>60?`<div class="ti" style="margin:6px 16px">…and ${un.length-60} more (lower the slider to see best guesses)</div>`:"");
 $("#tree").innerHTML=h;$("#tv").textContent=(thr*100).toFixed(0)+"%"}
function bars(c){return Object.entries(c||{}).map(([k,v])=>`<div class="sig"><span>${esc(k.replace("_"," "))}</span><div><div class="bar2 ${v<0?"neg":""}" style="width:${Math.min(100,Math.abs(v)*30)}%"></div></div><span>${v>0?"+":""}${v}</span></div>`).join("")||`<span class="ti">no signals</span>`}
function nm(id){return id==="GHOST"?"a leader missing from the data":id&&N[id]?N[id].name+" — "+N[id].title:"nobody"}
function why(id){const x=N[id];if(!x||x===R){return}
 $("#dr").innerHTML=`<button class="x" onclick="this.parentNode.style.display='none'">Close</button><b>${esc(x.name)}</b> <span class="ti">${esc(x.title)}</span><div class="ti">Parsed as ${x.fn||"unknown function"}, level ${x.lvl}</div>
 <div class="cols"><div><div class="tw">Why this edge (${(x.p*100).toFixed(0)}% confident)</div><div>→ ${esc(nm(x.to))}</div>${bars(x.cm)}</div>
 <div><div class="tw">Runner-up</div><div>→ ${esc(nm(x.ru))}</div>${bars(x.rc)}<div class="ti">${x.p<thr?"Abstained: the top two candidates are too close to call.":""}</div></div></div>
 ${truth?`<div class="tw">Ground truth</div>${x.tr==="MISSING"?"Manager is not in the dataset":esc(nm(x.tr))}`:""}`;$("#dr").style.display="block"}
const A=h=>{$("#ans").innerHTML=h;$("#ans").style.display="block"};
const place=x=>emitted(x)?`reports to <b>${esc(nm(x.to))}</b> (${(x.p*100).toFixed(0)}% confident)`:`manager unresolved; best guess <b>${esc(nm(x.to))}</b> at only ${(x.p*100).toFixed(0)}%, so no edge is drawn`;
function head(fn){const l=Object.values(N).filter(x=>x.fn===fn&&x!==R).sort((a,b)=>a.lvl-b.lvl);return l[0]}
$("#q1").onclick=()=>{const x=head("Data");if(!x)return A("No one in this company parses as part of a data team.");const g=Object.values(kids).flat().some(k=>k.to==="GHOST"&&k.fn==="Data");
 A(`Most senior data person: <b>${esc(x.name)}</b> — ${esc(x.title)}; ${place(x)}.`+(x.lvl>2?` There is no data executive in the dataset${g?", and the model flagged a hidden leader above them":""}: a likely hidden economic buyer.`:""))};
$("#q2").onclick=()=>{const x=head("Security");A(x?`<b>${esc(x.name)}</b> — ${esc(x.title)}; ${place(x)}.`:"No security function found in this company.")};
$("#q3").onclick=()=>{const x=Object.values(N).find(v=>v.name===$("#ch").value);if(!x)return A("Pick a name from the list first.");
 const path=[];let c=x;while(c&&c!==R&&emitted(c)&&c.to!=="GHOST"&&N[c.to]){c=N[c.to];path.push(c)}
 const top=path[path.length-1];const gh=c&&c!==R&&emitted(c)&&c.to==="GHOST";
 A(`Chain from <b>${esc(x.name)}</b>: ${path.length?path.map(p=>esc(p.name)+" ("+esc(p.title)+")").join(" → "):"no confident edge above this person"}.`+(top&&top.lvl<=2?` Likely economic buyer: <b>${esc(top.name)}</b>.`:gh?` The chain leads to a leader missing from the dataset, likely the real buyer.`:` The confident chain stops below executive level; the next edge is too uncertain to draw.`))};
$("#co").innerHTML=Object.entries(D.c).map(([k,v])=>`<option value="${k}">${esc(v.name)} · ${v.arch} · ${Object.keys(v.n).length} people · mess ${v.mess}</option>`).join("");
$("#co").onchange=e=>load(e.target.value);
$("#th").value=thr;$("#th").oninput=e=>{thr=+e.target.value;draw()};
$("#tr").onchange=e=>{truth=e.target.checked;draw()};
$("#tree").onclick=e=>{const t=e.target.closest(".nm");if(t){e.preventDefault();why(t.dataset.id)}};
load(Object.keys(D.c)[0]);
</script></body></html>
